name: Desktop tests
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run desktop tests
        run: python -m unittest discover -s tests -t . -v

      - name: Test native overlay in Chrome without an extension
        if: runner.os == 'Windows'
        run: |
          python -m pip install "playwright>=1.52,<2"
          python tools/smoke_native.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser smoke dependencies
        run: |
          python -m pip install "playwright>=1.52,<2" openpyxl defusedxml
          python -m playwright install --with-deps chromium
      - name: Test the installed extension on both prompt editors
        run: python tools/smoke_browser.py
