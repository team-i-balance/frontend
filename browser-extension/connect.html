<!doctype html>
<html lang="ko">
  <meta charset="utf-8" /><title>AI 누리 보안 연결</title>
  <style>
    /* 디자인 설정(docs/DESIGN-SETTINGS.md): 다크, 요소 면 입력, 주 행동 하나만 채운 파랑 */
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
    }
    body {
      width: 300px;
      margin: 0;
      padding: 20px;
      background: #1e2126;
      color: #f1f3f5;
      font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo',
        'Malgun Gothic', system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      word-break: keep-all;
    }
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 16px;
      color: #c1c7ce;
      font-size: 13px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 500;
    }
    input {
      display: block;
      width: 100%;
      height: 40px;
      margin: 6px 0 12px;
      padding: 8px 12px;
      border: 1px solid transparent;
      border-radius: 12px;
      background: #343a40;
      color: #f1f3f5;
      font: inherit;
    }
    input::placeholder {
      color: #868e96;
    }
    input:hover {
      border-color: #59616b;
    }
    input:focus {
      border-color: #c1c7ce;
      outline: none;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    button {
      height: 32px;
      padding: 0 12px;
      border: 1px solid #59616b;
      border-radius: 6px;
      background: #343a40;
      color: #f1f3f5;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover {
      background: #3b4148;
      border-color: #c1c7ce;
    }
    button.now {
      border-color: #3570e0;
      background: #3570e0;
      color: #fff;
      font-weight: 600;
    }
    button.now:hover {
      border-color: #2f63c5;
      background: #2f63c5;
    }
    button.text {
      border-color: transparent;
      background: transparent;
      color: #c1c7ce;
    }
    button.text:hover {
      background: #2e3439;
      color: #f1f3f5;
    }
    :focus-visible {
      outline: 2px solid #8fb5ff;
      outline-offset: 2px;
    }
    hr {
      margin: 16px 0;
      border: 0;
      border-top: 1px solid #3a4148;
    }
    output {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      color: #c1c7ce;
      font-size: 13px;
    }
    output::before {
      content: '';
      flex: none;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #868e96;
    }
    output[data-tone='ok']::before {
      background: #55dc92;
    }
    output[data-tone='error']::before {
      background: #ff7272;
    }
    output:empty {
      display: none;
    }
  </style>
  <header>
    <svg width="22" height="22" viewBox="0 0 64 64" aria-hidden="true">
      <g fill="#3D7EF7"><path d="M8 12H56V20H8Z M8 28H20V36H8Z M8 44H44V52H8Z" /><path d="M24 24H56V40H24Z" /></g>
    </svg>
    <h1>AI 누리 보안 연결</h1>
  </header>
  <p>
    PC 앱의 설정에서 ‘브라우저 연결 코드 복사’를 누른 뒤 붙여넣으세요. 연결하면 Claude(claude.ai)에서 쓰는
    프롬프트를 앱의 처리 위치로 실시간 검사합니다.
  </p>
  <form>
    <label>PC 연결 코드<input type="password" autocomplete="off" placeholder="연결 코드 붙여넣기" required /></label>
    <div class="row">
      <button class="now">연결</button>
      <button type="button" id="remove" class="text">해제</button>
    </div>
  </form>
  <hr />
  <div class="row">
    <button id="restore" type="button">AI 답변 복원 열기</button>
    <button id="tools" type="button" class="text">서버 기능 전체</button>
  </div>
  <output role="status"></output>
  <script src="connect.js"></script>
</html>
